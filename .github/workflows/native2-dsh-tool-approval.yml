name: Native2 DSH tool approval integration

on:
  pull_request:
    paths:
      - "src/adapters/chatgpt-web/**"
      - "src/types.ts"
      - "integration/native2-dsh-tool-approval/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native2-dsh-tool-approval:
    runs-on: ubuntu-latest
    name: ChatGPT Web Native2 -> DSH tool approval E2E
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.4.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Install DSH integration dependencies
        working-directory: integration/native2-dsh-tool-approval
        run: bun install --no-save

      - name: Run Native2 DSH approval E2E
        working-directory: integration/native2-dsh-tool-approval
        run: bun test
