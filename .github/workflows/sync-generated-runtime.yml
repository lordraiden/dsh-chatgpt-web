name: Sync Generated Runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-runtime-main
  cancel-in-progress: false

jobs:
  sync:
    name: Build and commit lib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build generated runtime
        run: bun run build

      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- lib; then
            echo "Generated runtime is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib
          git commit -m "build: sync generated runtime [skip ci]"
          git push origin HEAD:main
