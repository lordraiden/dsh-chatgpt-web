name: Temporary runtime sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Build runtime
        run: bun install --frozen-lockfile && bun run build

      - name: Commit generated runtime
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib; then
            echo "Generated lib is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "chore: sync generated runtime [skip ci]"
          git push origin HEAD:fix/connector-semantic-discovery
