name: Publish main

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure main has not advanced
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          target="${{ github.event.workflow_run.head_sha }}"
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$target" ]; then
            echo "main advanced from $target to $current; the newer main CI run will own publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.guard.outputs.publish == 'true'
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        if: steps.guard.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Install dependencies
        if: steps.guard.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build release artifact
        if: steps.guard.outputs.publish == 'true'
        run: |
          set -euo pipefail
          bun run build
          npm version patch --no-git-tag-version
          bun run build
          mkdir -p artifact
          npm pack --silent --pack-destination artifact
          tarball="$(find "$GITHUB_WORKSPACE/artifact" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          test -f "$tarball"
          node scripts/smoke-tarball.mjs "$tarball"

      - name: Resolve release version
        if: steps.guard.outputs.publish == 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure npmjs authentication
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '%s\n' \
            '@lordraiden:registry=https://registry.npmjs.org/' \
            "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
            > ~/.npmrc

      - name: Publish npmjs package
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tarball="$(find artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if npm view "@lordraiden/dsh-chatgpt-web@${version}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "npmjs already contains ${version}; continuing."
          else
            npm publish "$tarball" --registry https://registry.npmjs.org --access public
          fi

      - name: Configure GitHub Packages authentication
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' \
            '@lordraiden:registry=https://npm.pkg.github.com/' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > ~/.npmrc

      - name: Publish GitHub Packages package
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tarball="$(find artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if npm view "@lordraiden/dsh-chatgpt-web@${version}" version --registry https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "GitHub Packages already contains ${version}; continuing."
          else
            npm publish "$tarball" --registry https://npm.pkg.github.com
          fi

      - name: Commit published version
        if: steps.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Tag published version
        if: steps.guard.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; continuing."
          else
            git tag "${tag}"
            git push origin "${tag}"
          fi
