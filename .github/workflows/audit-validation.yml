name: Audit branch validation and bundle regeneration

on:
  push:
    branches:
      - audit/staging-hardening-v2-20261004

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Commit generated bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/; then
            echo "lib/ already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/
            git commit -m "build: regenerate committed bundles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: bun run test

# trigger validation
