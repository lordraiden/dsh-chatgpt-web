name: Temporary revert accidental 11A 11B main merge

on:
  push:
    branches:
      - revert-11ab-from-main

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revert branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Revert accidental architecture commits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 1341b4ef11a4dd0fba5710402f9f3faa319c6627
          git revert --no-edit 22694989920ffff6f4d711a9639f68d189dc91c0
          git rm .github/workflows/tmp-revert-11ab.yml
          git commit -m "chore: remove temporary main revert workflow"
          git push origin HEAD:revert-11ab-from-main
