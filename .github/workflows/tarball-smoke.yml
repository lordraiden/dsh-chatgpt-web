name: Tarball Smoke Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Validate clean tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build bundles
        run: bun run build

      - name: Pack exact validated artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          tarball="$(npm pack --silent --pack-destination artifact)"
          test -n "$tarball"
          test -f "$GITHUB_WORKSPACE/artifact/$tarball"

      - name: Smoke test the exact packed tarball
        run: |
          set -euo pipefail
          tarball="$(find artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/smoke-tarball.mjs "$GITHUB_WORKSPACE/artifact/$tarball"
