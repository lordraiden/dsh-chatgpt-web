name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-tarball:
    name: Validate clean tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;

          if (!/^v[0-9]+\\.[0-9]+\\.[0-9]+$/.test(tag)) {
            console.error(`Release tag must match vX.Y.Z; received ${tag}`);
            process.exit(1);
          }

          const tagVersion = tag.slice(1);
          if (tagVersion !== version) {
            console.error(`Release tag ${tag} does not match package.json version ${version}`);
            process.exit(1);
          }

          console.log(`Release tag ${tag} matches package version ${version}`);
          NODE

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build bundles
        run: bun run build

      - name: Pack validated artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact
          npm pack --silent --pack-destination artifact

          mapfile -t tarballs < <(find artifact -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi

          tarball="${tarballs[0]}"
          checksum="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          echo "Validated artifact: $tarball"
          echo "SHA-256: $checksum"

          echo "artifact_name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$checksum" >> "$GITHUB_OUTPUT"

      - name: Smoke test the exact validated artifact
        run: node scripts/smoke-tarball.mjs "artifact/${{ steps.package.outputs.artifact_name }}"

      - name: Upload validated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: artifact/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error

  publish-gpr:
    name: Publish to GitHub Packages
    needs: validate-tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8.0.0
        with:
          name: release-tarball
          path: artifact

      - name: Verify artifact integrity
        env:
          EXPECTED_SHA256: ${{ needs.validate-tarball.outputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          tarball="artifact/${{ needs.validate-tarball.outputs.artifact_name }}"
          test -f "$tarball"
          actual_sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"

          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Artifact digest mismatch: expected $EXPECTED_SHA256, got $actual_sha256" >&2
            exit 1
          fi

          echo "Publishing exact validated artifact: $(basename "$tarball")"
          echo "SHA-256: $actual_sha256"

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          set -euo pipefail

          tarball="artifact/${{ needs.validate-tarball.outputs.artifact_name }}"
          printf '%s\\n' \
  '@lordraiden:registry=https://npm.pkg.github.com/' \
  "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
  > ~/.npmrc

          npm publish "$tarball" --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npmjs.com
    needs: validate-tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8.0.0
        with:
          name: release-tarball
          path: artifact

      - name: Verify artifact integrity
        env:
          EXPECTED_SHA256: ${{ needs.validate-tarball.outputs.artifact_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          tarball="artifact/${{ needs.validate-tarball.outputs.artifact_name }}"
          test -f "$tarball"
          actual_sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"

          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Artifact digest mismatch: expected $EXPECTED_SHA256, got $actual_sha256" >&2
            exit 1
          fi

          echo "Publishing exact validated artifact: $(basename "$tarball")"
          echo "SHA-256: $actual_sha256"

      - name: Publish to npmjs.com
        shell: bash
        run: |
          set -euo pipefail

          tarball="artifact/${{ needs.validate-tarball.outputs.artifact_name }}"
          printf '%s\\n' \
  '@lordraiden:registry=https://registry.npmjs.org/' \
  "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" \
  > ~/.npmrc

          npm publish "$tarball" --registry https://registry.npmjs.org --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
