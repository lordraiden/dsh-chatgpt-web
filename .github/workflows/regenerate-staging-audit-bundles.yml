name: Regenerate staging audit bundles

on:
  push:
    branches:
      - audit/staging-hardening-20261004

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build committed artifacts
        run: bun run build

      - name: Commit generated bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/; then
            echo "Committed lib/ is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "build: regenerate committed bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# trigger build after workflow installation
