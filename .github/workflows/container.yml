name: Container image

# Keeps the production image from rotting: a broken Dockerfile, a broken Compose stack or a base image
# that no longer matches playwright-core fails CI instead of failing the operator (issue #246).
#
# Nothing is published here: the track deliberately does not push an image to any registry.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker/**"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "scripts/test-246-container-pin.mjs"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker/**"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "scripts/test-246-container-pin.mjs"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build the image and wait for health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Offline, so it fails fast and in a readable way before the expensive build.
      - name: Base image matches playwright-core
        run: node scripts/test-246-container-pin.mjs

      - name: Build the production image
        run: docker build -t dsh-chatgpt-web:local .

      - name: Start the stack and wait for the healthcheck
        run: docker compose up -d --wait

      - name: The liveness probe answers
        run: curl -fsS http://127.0.0.1:17841/healthz

      - name: The model catalogue answers
        run: curl -fsS http://127.0.0.1:17841/v1/models | head -c 200

      - name: Service logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down (and drop the data volume)
        if: always()
        run: docker compose down -v
