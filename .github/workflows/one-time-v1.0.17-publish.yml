name: One-time v1.0.17 package publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish v1.0.17 from exact tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.17
          fetch-depth: 0

      - name: Validate exact release
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.0.17"
          test "$(git rev-list -n 1 v1.0.17)" = "$(git rev-parse HEAD)"
          grep -Fq 'VERSION = "1.0.17"' lib/plugin.js

      - name: Publish package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '@lordraiden:registry=https://npm.pkg.github.com/' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > ~/.npmrc
          tarball="$(npm pack --silent)"
          if npm view "@lordraiden/dsh-chatgpt-web@1.0.17" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "GitHub Packages already contains @lordraiden/dsh-chatgpt-web@1.0.17"
            rm -f "$tarball"
          else
            npm publish "$tarball" --registry https://npm.pkg.github.com
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.17 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v1.0.17 already exists"
          else
            gh release create v1.0.17 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "v1.0.17" \
              --generate-notes \
              --latest
          fi
