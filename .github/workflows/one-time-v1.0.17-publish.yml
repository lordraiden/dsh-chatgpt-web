name: One-time v1.0.17 package publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish v1.0.17 from exact tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.17
          fetch-depth: 0

      - name: Validate release tag and package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.0.17"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 v1.0.17)"
          grep -Fq 'VERSION = "1.0.17"' lib/plugin.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        run: |
          bun run typecheck
          bun run build

      - name: Pack and smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          npm pack --silent --pack-destination artifact
          tarball="$(find artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/smoke-tarball.mjs "$tarball"

      - name: Publish to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s
' \
            '@lordraiden:registry=https://npm.pkg.github.com/' \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > ~/.npmrc
          if npm view "@lordraiden/dsh-chatgpt-web@1.0.17" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "GitHub Packages already contains @lordraiden/dsh-chatgpt-web@1.0.17"
          else
            tarball="$(find artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            npm publish "$tarball" --registry https://npm.pkg.github.com
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.0.17 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v1.0.17 already exists"
          else
            gh release create v1.0.17 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "v1.0.17" \
              --generate-notes \
              --latest
          fi
